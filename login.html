<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>


    <div class="container">


            <div class="d-flex justify-content-center align-items-center vh-100">
                <div class="border border-secondary rounded p-5 mb-5">
                    <div class="h3 pb-3 mb-4 text-center border-bottom border-secondary">Login</div>
                    <div style="width: 300px;">
                        <form action="">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label small">Email address</label>
                                <input type="email" class="form-control border-secondary shadow-none" id="FormControlInputEmail">
                            </div>

                            <div for="exampleFormControlInput1" class="form-label small">Password</div>
                            <div class="input-group mb-3">
                                <input type="password" class="form-control border-secondary shadow-none" id="passwordInput">
                                <!-- Toggle Button -->
                                <button class="btn btn-light btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            
                            <div class="d-grid py-4">
                                <button type="submit" class="btn btn-light border border-secondary">Login</button>
                            </div>
                        </form>                        
                    </div>
                </div>
            </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!------------------------- switch ----------------------------->
    <script>
        const passwordInput = document.querySelector("#passwordInput");
        const togglePasswordButton = document.querySelector("#togglePassword");
        const toggleIcon = document.querySelector("#toggleIcon");


        togglePasswordButton.addEventListener("click", function () {
        // Toggle the type attribute between password and text
        const type = passwordInput.getAttribute("type") === 'password' ? 'text' : 'password';
        passwordInput.setAttribute("type", type);

        
        
        // Toggle the icon classes between eye and eye-slash
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>

</html>
